name: Videur Claude (test)

# Appelle le videur Claude Haiku sur un faux token et montre sa réponse brute (diagnostic).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, hetzner]
    timeout-minutes: 5
    steps:
      - run: |
          cd /home/bot/app
          set -a; . /home/bot/bot.env; set +a
          .venv/bin/python - <<'PY'
          import json, os, requests, attente
          donnees = {"symbol": "TEST", "name": "Test token", "chain": "solana", "mcap": 500000, "liq": 80000,
                     "age_h": 40, "vol_24h": 900000, "chg_1h": -3, "buys_1h": 120, "sells_1h": 90,
                     "hausse_avant_repli": 1.8, "repli_depuis_sommet_pct": 22, "liquidite_vs_12h": 0.95,
                     "securite": "RugCheck : aucun risque", "concentration": "snipers 2 %, achats groupés 4 %, initiés 0 %"}
          f = {"hausse": 1.8, "repli": 0.22}
          t = {**donnees, "liq": 80000}
          print("verdict du videur :", attente.videur_claude(t, {"hausse": 1.8, "repli": 0.22, "liq_12h": 84000},
                                                          "RugCheck : aucun risque", "snipers 2 %"))
          PY
